# SERVER-side: pull the prebuilt image from Docker Hub and run it, with
# Watchtower auto-updating it whenever you push a new image from your PC.
# No source code needed on the server — only this file + .env.
#
# On the Debian server (/var/www/officeMal), copy this file as
# docker-compose.yml and create .env next to it, then:
#
#   docker login                          # once
#   docker compose pull
#   docker compose up -d
#   docker compose logs -f
#
# After this, your cycle is just: build+push from PC -> Watchtower pulls &
# restarts simli-worker on the server within a few minutes. No manual pull.
services:
  simli-worker:
    image: elieabdomal/simli-worker:latest
    container_name: simli-worker
    env_file: .env
    restart: unless-stopped
    pull_policy: always
    labels:
      # Only containers with this label are managed by Watchtower below, so it
      # will NEVER touch looking4-api / l4-api-db or anything else on the host.
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower
    container_name: simli-watchtower
    restart: unless-stopped
    environment:
      # containrrr/watchtower (no longer maintained) defaults to Docker API
      # 1.25; the server's Docker 29 accepts 1.40+ and rejected every check
      # ("client version 1.25 is too old"), so updates silently stopped.
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --interval 120 --cleanup
    # --label-enable: only watch containers labelled watchtower.enable=true
    #   (just simli-worker). --interval 120: check Docker Hub every 2 min.
    #   --cleanup: delete the old image after updating.
